<!doctype html>
<html lang="en" data-viz-kind="chart">
  <head>
    <meta charset="utf-8">
    <title>OpenRouter social square example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: var(--font-sans);
      }
      .dark {
        color-scheme: dark;
      }
      body {
        width: 1080px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: hsl(var(--foreground));
        font-family: var(--font-sans);
      }
      .frame {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        padding: 96px 64px 56px;
      }
      .eyebrow {
        color: hsl(var(--muted-foreground));
        font-family: var(--font-mono);
        font-size: 21px;
      }
      h1 {
        margin: 14px 0 0;
        max-width: 940px;
        font-size: 58px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 26px;
        margin: 24px 0 0;
        padding: 0;
        list-style: none;
        font-family: var(--font-mono);
        font-size: 22px;
        color: hsl(var(--foreground));
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 999px;
      }
      .plot {
        margin-top: 26px;
        width: 952px;
        height: 600px;
        overflow: visible;
      }
      .plot-tall {
        height: 760px;
      }
      .marker-rule {
        stroke: hsl(var(--muted-foreground));
        stroke-width: 3;
        stroke-dasharray: 12 8;
      }
      .gridline {
        stroke: hsl(var(--muted-foreground));
        stroke-width: 1.5;
        stroke-dasharray: 5 6;
      }
      .axis-line {
        stroke: hsl(var(--border));
      }
      .axis-label {
        fill: hsl(var(--muted-foreground));
        font-family: var(--font-mono);
        font-size: 24px;
      }
      .value-label {
        fill: hsl(var(--foreground));
        font-size: 46px;
        font-weight: 700;
      }
      .callout {
        fill: hsl(var(--foreground));
        font-size: 30px;
        font-weight: 700;
      }
      .b0 { background: var(--chart-1); }
      .b1 { background: var(--chart-2); }
      .b2 { background: var(--chart-3); }
      .b3 { background: var(--chart-4); }
      .b-neutral { background: var(--chart-tokens-uncached); }
      .s0 { fill: var(--chart-1); }
      .s1 { fill: var(--chart-2); }
      .s2 { fill: var(--chart-3); }
      .s3 { fill: var(--chart-4); }
      .s-neutral { fill: var(--chart-tokens-uncached); }
      .band-total {
        fill: var(--chart-1);
        fill-opacity: 40%;
      }
      .edge-total {
        fill: none;
        stroke: var(--chart-1);
        stroke-width: 6;
      }
      .dot-total { fill: var(--chart-1); }
      .footer-link {
        position: absolute;
        right: 64px;
        bottom: 48px;
        color: hsl(var(--foreground));
        font-family: var(--font-mono);
        font-size: 22px;
      }
      .source-line {
        position: absolute;
        left: 64px;
        bottom: 48px;
        color: hsl(var(--muted-foreground));
        font-family: var(--font-mono);
        font-size: 21px;
      }
    </style>
  </head>

      <text class="axis-label" x="98" y="324.5">four weeks ago</text>

      <text class="value-label" x="900.0" y="34.6">113T</text>
      <text class="axis-label" x="82.0" y="722" text-anchor="middle">Sep 1</text>
      <text class="axis-label" x="285.4" y="722" text-anchor="middle">Dec 1</text>
      <text class="axis-label" x="488.8" y="722" text-anchor="middle">Mar 2</text>
      <text class="axis-label" x="692.2" y="722" text-anchor="middle">Jun 1</text>
      <text class="axis-label" x="880.0" y="722" text-anchor="middle">Aug 24</text>
      </svg>
      <div class="footer-link">openrouter.ai/rankings</div>
      <div class="source-line" data-viz-source>Source: OpenRouter analytics</div>
    </main>
  </body>
</html>
